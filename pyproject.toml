[project]
name = "assay"
version = "0.1.0"
description = "ASSAY — defensive pre-deployment security scanner for AI model weight files."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "medmnist>=3.0",
    "torchvision>=0.17",
]

[project.scripts]
assay = "assay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assay"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
